[package]
name = "unroxy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "unroxy"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["full"] }
unroxy-psiphon = { path = "../../../crates/psiphon", default-features = false, features = ["crypto-ring"] }
unroxy-proxy = { path = "../../../crates/proxy" }
