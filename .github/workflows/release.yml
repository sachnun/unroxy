name: Release

on:
  push:
    branches: [main, beta]
    paths:
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - Dockerfile
      - .dockerignore
      - .github/workflows/release.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  TAGS: PSIPHON_DISABLE_INPROXY PSIPHON_DISABLE_QUIC PSIPHON_DISABLE_GQUIC
  LDFLAGS: "-s -w -checklinkname=0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -short ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
          - {os: windows, arch: amd64, ext: .exe}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -trimpath -tags "$TAGS" -ldflags="$LDFLAGS" \
            -o dist/unroxy-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/unroxy
      - uses: actions/upload-artifact@v4
        with:
          name: unroxy-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sachnun/unroxy
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=beta-,format=short,enable=${{ github.ref == 'refs/heads/beta' }}
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
