name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  wasm:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Build unroxy (wasm)
        run: cargo build --release --locked --target wasm32-wasip2 -p unroxy-wasm
      - name: Checksum
        working-directory: target/wasm32-wasip2/release
        run: sha256sum unroxy.wasm > unroxy.wasm.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: unroxy-wasm
          path: |
            target/wasm32-wasip2/release/unroxy.wasm
            target/wasm32-wasip2/release/unroxy.wasm.sha256
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build unroxy (linux-amd64)
        run: |
          cargo build --release --locked -p unroxy
          cp target/release/unroxy unroxy-x86_64-unknown-linux-gnu
          sha256sum unroxy-x86_64-unknown-linux-gnu > unroxy-x86_64-unknown-linux-gnu.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: unroxy-linux
          path: |
            unroxy-x86_64-unknown-linux-gnu
            unroxy-x86_64-unknown-linux-gnu.sha256
          if-no-files-found: error

  docker:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unroxy-linux
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  release:
    needs: [wasm, linux, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unroxy-wasm
      - uses: actions/download-artifact@v4
        with:
          name: unroxy-linux
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            unroxy.wasm
            unroxy.wasm.sha256
            unroxy-x86_64-unknown-linux-gnu
            unroxy-x86_64-unknown-linux-gnu.sha256
          generate_release_notes: true
