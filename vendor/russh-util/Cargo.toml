[package]
name = "russh-util"
version = "0.52.0"
edition = "2021"
rust-version = "1.75"
description = "Runtime abstraction utilities for russh."
license = "Apache-2.0"
repository = "https://github.com/warp-tech/russh"

[lib]
name = "russh_util"
path = "src/lib.rs"

[dependencies.tokio]
version = "1.17.0"
features = ["sync", "macros"]

[target.'cfg(not(target_os = "unknown"))'.dependencies.tokio]
version = "1.17.0"
features = ["io-util", "rt-multi-thread", "rt"]

[target.'cfg(target_os = "unknown")'.dependencies.chrono]
version = "0.4.38"

[target.'cfg(target_os = "unknown")'.dependencies.wasm-bindgen]
version = "0.2"

[target.'cfg(target_os = "unknown")'.dependencies.wasm-bindgen-futures]
version = "0.4.43"
