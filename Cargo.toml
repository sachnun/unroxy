[workspace]
members = ["crates/psiphon", "crates/unroxy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
libc = "0.2"
lru = "0.18"
rand = "0.9"
rsa = "0.9"
russh = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
wreq = { version = "0.16", default-features = false, features = ["tokio-rt", "webpki-roots", "gzip", "brotli", "stream", "socks"] }
wreq-util = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
russh = { path = "vendor/russh" }
