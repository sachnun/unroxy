[package]
name = "unroxy-psiphon"
version = "0.1.0"
edition = "2024"

[lib]
name = "unroxy_psiphon"
path = "src/lib.rs"

[features]
default = ["crypto-aws-lc"]
crypto-aws-lc = ["russh/aws-lc-rs"]
crypto-ring = ["russh/ring"]

[dependencies]
base64 = "0.22"
bytes = "1"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
lru = "0.18"
rand = "0.9"
rand010 = { package = "rand", version = "0.10" }
rsa = "0.9"
russh = { version = "0.63", default-features = false, features = ["rsa", "flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
