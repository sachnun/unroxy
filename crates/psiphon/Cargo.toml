[package]
name = "unroxy-psiphon"
version = "0.1.0"
edition = "2024"

[lib]
name = "unroxy_psiphon"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
lru = "0.18"
makiko = "0.2"
rand = "0.9"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "2"
tokio = { workspace = true, features = ["io-util", "sync", "macros", "time"] }
tracing = "0.1"
unroxy-net = { path = "../net" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["full"] }
